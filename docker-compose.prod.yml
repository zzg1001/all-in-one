# 生产环境 Docker Compose
#
# 部署命令:
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# 包含: MySQL + Backend + Portal + Admin + Nginx

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: ai-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-ai_agent}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Backend ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-backend
    restart: always
    # ports:
    #   - "8001:8001"  # 不对外暴露，统一走 nginx 网关
    env_file:
      - ./deploy.env
    environment:
      - DB_HOST=mysql
    volumes:
      - ./backend/skills_storage:/app/skills_storage
      - ./backend/outputs:/app/outputs
      - ./backend/uploads:/app/uploads
      - ./backend/file_manage:/app/file_manage
      - ./logs:/app/logs
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  # ========== Frontend - Portal ==========
  portal-web:
    build:
      context: ./frontend/portal
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: ai-portal
    restart: always
    networks:
      - app-network
    depends_on:
      - backend

  # ========== Frontend - Admin ==========
  admin-web:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_PORTAL_URL=/
    container_name: ai-admin
    restart: always
    networks:
      - app-network
    depends_on:
      - backend

  # ========== Nginx 网关 ==========
  nginx:
    image: nginx:alpine
    container_name: ai-nginx
    restart: always
    ports:
      - "8096:80"
      # - "443:443"  # 如需 HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - app-network
    depends_on:
      - backend
      - portal-web
      - admin-web

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
