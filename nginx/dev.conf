# 本地开发 Nginx 网关（统一入口 :8096）
# 路由结构与生产 nginx/conf.d/default.conf 保持一致，server_name 用 localhost。
# 前端容器(portal-web/admin-web)、后端(backend) 之间走 docker 内网服务名访问。

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # ---------- Portal 用户端（默认，base=/） ----------
    location / {
        proxy_pass http://portal-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Admin 管理端（base=/admin/，保留前缀转发） ----------
    # 注意：proxy_pass 不带尾斜杠，保留 /admin/ 前缀，
    # 与 admin 容器内部 nginx 的 location /admin/ 对应，避免重定向死循环。
    location /admin/ {
        proxy_pass http://admin-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin {
        return 301 /admin/;
    }

    # ---------- API 后端 ----------
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ---------- 后端静态文件 ----------
    location /uploads/ {
        proxy_pass http://backend:8001/uploads/;
    }
    location /outputs/ {
        proxy_pass http://backend:8001/outputs/;
    }
}
