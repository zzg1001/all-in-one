# AI Skills Platform Nginx 配置
#
# 修改说明:
#   1. 将 your-domain.com 替换为你的实际域名
#   2. 如需 HTTPS，取消注释 SSL 配置并放置证书到 ssl/ 目录
#

# HTTP 配置
server {
    listen 80;
    server_name infortest.ike-data.com;  # 修改为你的域名

    # 如需强制 HTTPS，取消下行注释
    # return 301 https://$server_name$request_uri;

    # Portal 用户端 (默认)
    location / {
        proxy_pass http://portal-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin 管理端
    location /admin {
        proxy_pass http://admin-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 后端
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 静态文件（上传/输出）
    location /uploads/ {
        proxy_pass http://backend:8001/uploads/;
    }

    location /outputs/ {
        proxy_pass http://backend:8001/outputs/;
    }
}

